# Delta extraction for 4MOST LRS quasars, Lyman-alpha region, BAO 3D.
#
# The 4MOST delivery is a single FITS file with one row per spectrum. The
# wavelength grid (3700-9500 Angstrom inclusive, 0.25 Angstrom step, 23201
# pixels) is not stored in the file and is hardcoded in FourmostData.
#
# Objects observed several times appear as several rows holding nested
# cumulative stacks of the same photons. FourmostQuasarCatalogue keeps only
# the longest stack of each object.
#
# No [corrections] and no [masks] sections: the delivery carries no BAL or
# DLA information and EBV is entirely NaN, so BalMask, DlaMask and
# DustCorrection cannot be driven from it. A 4MOST-specific sky-line list for
# LinesMask is future work; the picca-shipped etc/dr16-line-sky-mask.txt is
# SDSS-specific and should not be reused blind.

[general]
overwrite = True
out dir = $FOURMOST_OUT/Delta_lya/
num processors = 4

[data]
type = FourmostData
catalogue = $FOURMOST_DATA/QSO_lyamn_aplha_spectra.fits
analysis type = BAO 3D
# blue edge below 3900 Angstrom carries 10-50x the noise of the plateau
lambda min = 3950.0
# red edge degrades beyond 9300 Angstrom
lambda max = 9300.0
lambda min rest frame = 1040.0
lambda max rest frame = 1200.0
# keep the native sampling: the delivered pixel noise is close to independent
# (measured lag-1 difference ratio 0.68/0.67/1.02 in blue/green/red), so there
# is no noise-decorrelation reason to rebin. Matching delta lambda to the
# native step also keeps reso_pix and pixel_step consistent for a later P1D.
delta lambda = 0.25
# 2.1 matches the delivered catalogue floor. Raising it to 2.80 restricts to
# quasars whose full 1040 Angstrom rest-frame window falls above lambda min.
z min = 2.1
z max = 4.1
minimum number pixels in forest = 50

[expected flux]
type = Dr16ExpectedFlux
iter out prefix = delta_attributes
num iterations = 5
