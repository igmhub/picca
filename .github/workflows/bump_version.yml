name: Bump version
on: 
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'py/picca/_version.py'
      - '.bumpversion.cfg'
jobs:
  bump_version:
    runs-on: ubuntu-latest
    steps:
    # Short-lived installation token for the picca-version-bot GitHub App. The App is on the
    # bypass list of the main-branch rulesets, so it can push the version-bump commit and tags.
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.BUMP_APP_CLIENT_ID }}
        private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
        permission-contents: write

    - uses: actions/checkout@v4
      with:
        token: ${{ steps.app-token.outputs.token }}

    # Commit as the App's bot account (user id 337890195 of picca-version-bot[bot])
    - name: setup git
      run: |
        git config --global user.email "337890195+picca-version-bot[bot]@users.noreply.github.com"
        git config --global user.name "picca-version-bot[bot]"
    
    - name: Set up Python
      uses: actions/setup-python@v5
      
    - name: Install bump2version
      run:  pip install bump2version
            
    - name: increase patch
      if: ${{ success() && (!contains(github.event.head_commit.message, '[bump major]')) && (!contains(github.event.head_commit.message, '[bump minor]')) && (!contains(github.event.head_commit.message, '[no bump]')) }}
      run: bump2version patch --verbose
      
    - name: Bump major version
      if: ${{ success() && contains(github.event.head_commit.message, '[bump major]') }}
      run: bump2version major --verbose --tag
      
    - name: Bump minor version
      if: ${{ success() && contains(github.event.head_commit.message, '[bump minor]') }}
      run: bump2version minor --verbose --tag
      
    - name: No version bump
      if: ${{ success() && contains(github.event.head_commit.message, '[no bump]') }}
      run: echo "No version bump requested"
      
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ steps.app-token.outputs.token }}
        tags: true
