# Default input paths for covariance denoising, one block per sample.
#
# [<SAMPLE>]
#   mock_types       : space-separated mock types = classifier groups.
#                      Each needs a [<SAMPLE>.<mock_type>] section.
#   train_only_regex : regex on the file basename. Matching noisy files always
#                      go to the training set (never to testing). Optional.
#   ref_corr         : reference correlation matrix defining the eigenbasis.
#                      Optional here; can also be given with --ref-corr.
#   model            : fitted model .npz for this sample, used by
#                      DenoiseModel.load_sample(). Leave unset until a model
#                      has been made with picca_denoise_fit_classifier.py.
#
# [<SAMPLE>.<mock_type>]
#   noisy_glob : glob pattern for the noisy covariance matrices
#   clean_cov  : clean covariance matrix for this mock type (the same ones
#                used to derive the reference eigenbasis)
#
# Environment variables and ~ are expanded. To change paths without editing
# this file, write a config with only the sections/options you want to change
# and pass it to the scripts with --paths-config.

[DR1]
mock_types = london saclay
train_only_regex = y1stack\d+i
# ref_corr =
# model =

[DR1.london]
noisy_glob = /global/cfs/cdirs/desi/users/wmturner/denoising/covariance/y1/london/baseline/noisy/global_cov_y1stack*_rescaled.fits
clean_cov = /global/cfs/cdirs/desi/users/wmturner/denoising/covariance/y1/london/baseline/clean/global_cov_y1stack0-199_rescaled.fits

[DR1.saclay]
noisy_glob = /global/cfs/cdirs/desi/users/wmturner/denoising/covariance/y1/saclay/baseline/noisy/global_cov_y1stack*_rescaled.fits
clean_cov = /global/cfs/cdirs/desi/users/wmturner/denoising/covariance/y1/saclay/baseline/clean/global_cov_y1stack0-49-0i-49i_rescaled.fits

